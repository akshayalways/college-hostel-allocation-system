<!DOCTYPE html>
<html>
<head><title>Admin Login</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
<nav class="navbar"><h2>🏠 Hostel Allocation System</h2><a href="{{ url_for('home') }}">Home</a></nav>
<div class="form-container">
<h1>Admin Login 👩‍💼</h1>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="POST">
<input type="email" name="email" placeholder="Admin Email" required>
<input type="password" name="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>
</div>
</body>
</html>
