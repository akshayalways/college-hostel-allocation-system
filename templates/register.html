<!DOCTYPE html>
<html>
<head><title>Student Registration</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
<nav class="navbar"><h2>🏠 Hostel Allocation System</h2><a href="{{ url_for('home') }}">Home</a></nav>
<div class="form-container">
<h1>Student Registration</h1>
{% if message %}<div class="message">{{ message }}</div>{% endif %}
<form method="POST">
<input name="name" placeholder="Full Name" required>
<input type="email" name="email" placeholder="Email" required>
<input name="phone" placeholder="Phone Number" required>
<select name="gender" required><option value="">Select Gender</option><option>Female</option><option>Male</option></select>
<input name="course" placeholder="Course" required>
<input type="number" name="year" min="1" max="4" placeholder="Year" required>
<input name="address" placeholder="Address" required>
<button type="submit">Register</button>
</form>
<p>Already registered? <a href="{{ url_for('login') }}">Student Login</a></p>
</div>
</body>
</html>
